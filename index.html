
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DFC 2027</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:white;font-family:Arial;text-align:center}
header{padding:18px;background:#102944;border-bottom:3px solid #20d879}
h1{margin:5px;color:#20e88a;font-size:32px}
button{border:0;border-radius:12px;padding:14px 20px;background:#16c978;color:#052316;font-weight:bold;font-size:16px;margin:6px}
#menu{padding:25px 12px}
#game{display:none;padding:8px}
canvas{width:100%;max-width:700px;background:#168746;border:3px solid white;border-radius:10px;touch-action:none}
.controls{display:flex;justify-content:space-around;align-items:center;max-width:700px;margin:10px auto}
.pad{display:grid;grid-template-columns:48px 48px 48px;gap:4px}
.pad button{padding:13px 5px;margin:0;background:#254766;color:white}
.actions button{display:block;width:85px;height:55px}
#score{font-size:20px;margin:8px}
small{color:#b8c8d8}
</style>
</head>
<body>
<header>
<h1>DFC 2027</h1>
<small>EL FÚTBOL ES TUYO</small>
</header>

<div id="menu">
<h2>Bienvenido a DFC 2027</h2>
<p>Construí tu equipo y empezá a jugar.</p>
<button onclick="start()">JUGAR PARTIDO</button>
<button onclick="team()">MI EQUIPO</button>
<p id="teamInfo">DFC FC · GRL 75</p>
</div>

<div id="game">
<div id="score">DFC FC 0 - 0 RIVAL | 00:00</div>
<canvas id="field" width="700" height="430"></canvas>
<div class="controls">
<div class="pad">
<span></span><button data-key="up">▲</button><span></span>
<button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button>
</div>
<div class="actions">
<button onclick="kick()">TIRAR ⚽</button>
<button onclick="passBall()">PASAR</button>
<button onclick="back()">SALIR</button>
</div>
</div>
<small>Usá las flechas para moverte.</small>
</div>

<script>
const c=document.getElementById("field"),ctx=c.getContext("2d");
let x=180,y=215,bx=350,by=215,vx=0,vy=0;
let keys={},playing=false,seconds=0,goals=0,enemy=0;
let teammates=[{x:100,y:110},{x:100,y:320},{x:240,y:100},{x:240,y:330},{x:310,y:160},{x:310,y:270},{x:390,y:100},{x:390,y:330},{x:480,y:160},{x:480,y:270}];
function team(){document.getElementById("teamInfo").innerText="DFC FC · GRL 75 · 11 JUGADORES";alert("Tu equipo está listo para jugar.");}
function start(){
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";
playing=true;seconds=0;goals=0;enemy=0;
x=180;y=215;bx=350;by=215;
draw();
}
function back(){playing=false;document.getElementById("game").style.display="none";document.getElementById("menu").style.display="block";}
document.querySelectorAll("[data-key]").forEach(b=>{
let k=b.dataset.key;
b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});
["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});
function kick(){
if(!playing)return;
let dx=bx-x,dy=by-y;
if(Math.hypot(dx,dy)<85){vx=8;vy=(215-by)*.035;}
else {vx=7;vy=0;}
}
function passBall(){
if(Math.hypot(bx-x,by-y)<90){vx=5;vy=0;}
}
function draw(){
if(!playing)return;
ctx.clearRect(0,0,700,430);
ctx.fillStyle="#168746";ctx.fillRect(0,0,700,430);
ctx.strokeStyle="white";ctx.lineWidth=3;
ctx.strokeRect(15,15,670,400);
ctx.beginPath();ctx.moveTo(350,15);ctx.lineTo(350,415);ctx.stroke();
ctx.beginPath();ctx.arc(350,215,65,0,Math.PI*2);ctx.stroke();
ctx.strokeRect(15,125,100,180);ctx.strokeRect(585,125,100,180);
ctx.strokeRect(15,165,45,100);ctx.strokeRect(640,165,45,100);
ctx.fillStyle="white";
for(let i=0;i<teammates.length;i++){let p=teammates[i];ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();}
ctx.fillStyle="#ffdb37";ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#ed3434";ctx.beginPath();ctx.arc(530,215,15,0,Math.PI*2);ctx.fill();
ctx.fillStyle="white";ctx.beginPath();ctx.arc(bx,by,9,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle="#111";ctx.font="13px Arial";ctx.fillText("DFC",x-13,y+28);
ctx.fillText("RIVAL",515,245);
if(keys.up)y-=3;if(keys.down)y+=3;if(keys.left)x-=3;if(keys.right)x+=3;
x=Math.max(20,Math.min(680,x));y=Math.max(20,Math.min(410,y));
bx+=vx;by+=vy;vx*=.985;vy*=.985;
if(bx>685){goals++;bx=350;by=215;vx=0;}
if(bx<15){enemy++;bx=350;by=215;vx=0;}
by=Math.max(15,Math.min(415,by));
document.getElementById("score").innerText="DFC FC "+goals+" - "+enemy+" RIVAL";
requestAnimationFrame(draw);
}
</script>
</body>
</html>
